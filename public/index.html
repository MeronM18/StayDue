<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to StayDue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 460px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }
        
        .login-title .heart {
            color: #5eb3d6;
            font-size: 1.8rem;
        }
        
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        
        .auth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem;
            background: white;
            color: #1a1a1a;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        
        .auth-btn:hover {
            background: #f5f5f5;
        }
        
        .auth-btn svg,
        .auth-btn .icon {
            width: 20px;
            height: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .divider {
            text-align: center;
            margin: 1.5rem 0;
            color: #666;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .email-section {
            margin-bottom: 1.5rem;
        }
        
        .email-label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }
        
        .email-input {
            width: 100%;
            padding: 1rem;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            color: #1a1a1a;
            outline: none;
            transition: background 0.2s;
        }
        
        .email-input::placeholder {
            color: #666;
        }
        
        .email-input:focus {
            background: #e8e8e8;
        }
        
        .continue-btn {
            width: 100%;
            padding: 1rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }
        
        .continue-btn:hover {
            background: #2a2a2a;
        }
        
        .signup-link {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
        }
        
        .signup-link a {
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        
        .signup-link a:hover {
            color: #4a4a4a;
        }
        
        .edu-notice {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
            margin-top: 2rem;
        }
        
        .footer {
            position: fixed;
            bottom: 2rem;
            display: flex;
            gap: 2rem;
            font-size: 0.875rem;
        }
        
        .footer a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .footer a:hover {
            color: #1a1a1a;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 1.5rem;
            }
            
            .login-title {
                font-size: 1.75rem;
            }
            
            .footer {
                position: static;
                margin-top: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1 class="login-title">Login to StayDue <span class="heart">💙</span></h1>
        </div>
        
        <div class="auth-buttons">
            <button class="auth-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            
            <button class="auth-btn">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="#1a1a1a" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5-9h3v6H7v-6zm8-2h3v8h-3V9zm-4-2h3v10h-3V7z"/>
                </svg>
                Sign in with LMS
            </button>
        </div>
        
        <div class="divider">OR</div>
        
        <div class="email-section">
            <label class="email-label">Email</label>
            <input 
                type="email" 
                class="email-input" 
                placeholder="Email address"
            >
        </div>
        
        <button class="continue-btn">Continue with Email</button>
        
        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
        
        <p class="edu-notice">
            Some .edu addresses block sign-in links — use a personal email or Google.
        </p>
    </div>
    
    <div class="footer">
        <a href="#">Terms</a>
        <a href="#">Privacy Policy</a>
    </div>
</body>
</html>
